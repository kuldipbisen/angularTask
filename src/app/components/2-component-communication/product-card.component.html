<div class="product-card">
  <div class="product-header">
    <h3>{{ product.name }}</h3>
    <span class="price">$ {{ product.price }}</span>
  </div>

  <p class="description" *ngIf="product.description">
    {{ product.description }}
  </p>

  <div class="actions">
    <button 
      (click)="onAddToCart()" 
      class="btn-primary">
      Add to Cart
    </button>
    <button 
      (click)="onViewDetails()" 
      class="btn-secondary">
      View Details
    </button>
    <button 
      (click)="onRemoveProduct()"
      class="btn-danger">
      Remove
    </button>
  </div>

  <!-- Display any additional info passed via property -->
  <div class="info" *ngIf="showDetails">
    <small>Product ID: {{ product.id }}</small>
  </div>
</div>
