<nav class="breadcrumbs" *ngIf="breadcrumbs.length > 0">
  <ol class="breadcrumb-list">
    <li class="breadcrumb-item">
      <a routerLink="/courses" class="breadcrumb-link">Home</a>
    </li>
    <li *ngFor="let breadcrumb of breadcrumbs; let last = last" class="breadcrumb-item">
      <span class="separator">/</span>
      <a [routerLink]="breadcrumb.path" class="breadcrumb-link" [class.active]="last">{{ breadcrumb.label }}</a>
    </li>
  </ol>
</nav>
