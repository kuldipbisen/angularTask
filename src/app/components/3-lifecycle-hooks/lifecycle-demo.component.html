<div class="lifecycle-container">
  <h2>Lifecycle Hooks Demo</h2>

  <!-- Input to trigger ngOnChanges -->
  <div class="input-section">
    <label>
      Name:
      <input [(ngModel)]="name" type="text">
    </label>
    <label>
      Counter:
      <input [(ngModel)]="counter" type="number">
    </label>
  </div>

  <!-- Display component state -->
  <div class="state-section">
    <h3>Component State</h3>
    <p>Name: <strong>{{ name }}</strong></p>
    <p>Counter: <strong>{{ counter }}</strong></p>
    <p>Is Initialized: <strong>{{ isInitialized }}</strong></p>
  </div>

  <!-- Reference element for ViewChild -->
  <div #myElement class="element-section">
    <p>This is a template element</p>
  </div>

  <!-- Display lifecycle events log -->
  <div class="log-section">
    <h3>Lifecycle Events Log</h3>
    <div class="log-container">
      <div *ngFor="let event of lifecycleLog" class="log-entry">
        {{ event }}
      </div>
    </div>
    <button (click)="clearLog()">Clear Log</button>
  </div>

  <!-- Display element reference info -->
  <div class="info-section" *ngIf="isInitialized && elementText">
    <h3>Template Element Info</h3>
    <p>Element text: <strong>{{ elementText }}</strong></p>
  </div>
</div>
