<div class="login-wrapper">
  <div class="login-container">
    <div class="login-card">
      <h2 class="login-title">Login</h2>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="username">Username: <span class="required">*required</span></label>
          <input
            id="username"
            type="text"
            formControlName="username"
            class="form-control"
            placeholder="Enter username"
            [class.is-invalid]="username?.invalid && (username?.dirty || username?.touched)"
          />
          <div class="error-message" *ngIf="username?.invalid && (username?.dirty || username?.touched)">
            <span *ngIf="username?.errors?.['required']">Username is required</span>
            <span *ngIf="username?.errors?.['minlength']">Username must be at least 3 characters</span>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password: <span class="required">*required</span></label>
          <input
            id="password"
            type="password"
            formControlName="password"
            class="form-control"
            placeholder="Enter password"
            [class.is-invalid]="password?.invalid && (password?.dirty || password?.touched)"
          />
          <div class="error-message" *ngIf="password?.invalid && (password?.dirty || password?.touched)">
            <span *ngIf="password?.errors?.['required']">Password is required</span>
            <span *ngIf="password?.errors?.['minlength']">Password must be at least 6 characters</span>
          </div>
        </div>

        <div class="forgot-password">
          <a href="#" (click)="onForgotPassword($event)">Forgot password?</a>
        </div>

        <div *ngIf="errorMessage" class="alert alert-danger">
          {{ errorMessage }}
        </div>

        <button
          type="submit"
          class="btn btn-primary btn-block"
          [disabled]="isLoading"
        >
          {{ isLoading ? 'Signing in...' : 'Login' }}
        </button>
      </form>
    </div>
  </div>

  <div class="login-footer">
    <p>Copyright © Videocourses. All rights reserved!</p>
  </div>
</div>
