<div class="login-wrapper">
  <div class="login-header-bar">
    <h1>User login</h1>
  </div>

  <div class="login-container">
    <div class="login-card">
      <h2 class="login-title">Login</h2>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email">E-mail: <span class="required">*required</span></label>
          <input
            id="email"
            type="email"
            formControlName="email"
            class="form-control"
            placeholder="Enter e-mail"
            [class.is-invalid]="email?.invalid && (email?.dirty || email?.touched)"
          />
          <div class="error-message" *ngIf="email?.invalid && (email?.dirty || email?.touched)">
            <span *ngIf="email?.errors?.['required']">Email is required</span>
            <span *ngIf="email?.errors?.['email']">Please enter a valid email</span>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password: <span class="required">*required</span></label>
          <input
            id="password"
            type="password"
            formControlName="password"
            class="form-control"
            placeholder="Enter password"
            [class.is-invalid]="password?.invalid && (password?.dirty || password?.touched)"
          />
          <div class="error-message" *ngIf="password?.invalid && (password?.dirty || password?.touched)">
            <span *ngIf="password?.errors?.['required']">Password is required</span>
            <span *ngIf="password?.errors?.['minlength']">Password must be at least 6 characters</span>
          </div>
        </div>

        <div class="forgot-password">
          <a href="#" (click)="onForgotPassword($event)">Forgot password?</a>
        </div>

        <div *ngIf="errorMessage" class="alert alert-danger">
          {{ errorMessage }}
        </div>

        <button
          type="submit"
          class="btn btn-primary btn-block"
          [disabled]="isLoading"
        >
          {{ isLoading ? 'Signing in...' : 'Login' }}
        </button>
      </form>
    </div>
  </div>

  <div class="login-footer">
    <p>Copyright © Videocourses. All rights reserved!</p>
  </div>
</div>
