<div class="courses-list-container">
  <header class="courses-header">
    <h1>Available Courses</h1>
    <p class="courses-count">{{ courses.length }} courses available</p>
  </header>

  <div class="courses-list">
    <app-course-item 
      *ngFor="let course of courses" 
      [course]="course"
    ></app-course-item>
  </div>
</div>
