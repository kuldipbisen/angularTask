<div class="course-card">
  <div class="course-header">
    <h3 class="course-title">{{ course.title }}</h3>
    <div class="course-rating">
      <span class="stars">★</span>
      <span class="rating-value">{{ course.rating }}</span>
    </div>
  </div>

  <div class="course-meta">
    <span class="instructor">{{ course.instructor }}</span>
    <span class="level" [class]="'level-' + course.level.toLowerCase()">
      {{ course.level }}
    </span>
  </div>

  <p class="course-description">{{ course.description }}</p>

  <div class="course-stats">
    <div class="stat">
      <span class="stat-label">Students:</span>
      <span class="stat-value">{{ course.students }}</span>
    </div>
    <div class="stat">
      <span class="stat-label">Price:</span>
      <span class="stat-value">${{ course.price }}</span>
    </div>
  </div>

  <div class="course-actions">
    <button class="btn btn-primary" (click)="onView()" title="View course details">
      View
    </button>
    <button class="btn btn-secondary" (click)="onEdit()" title="Edit course">
      Edit
    </button>
    <button class="btn btn-danger" (click)="onDelete()" title="Delete course">
      Delete
    </button>
  </div>
</div>
