<div class="confirm-dialog">
  <div class="dialog-header">
    <h2>{{ title }}</h2>
  </div>
  <div class="dialog-content">
    <p>{{ message }}</p>
  </div>
  <div class="dialog-actions">
    <button (click)="onCancel()" class="btn btn-secondary">
      {{ cancelText }}
    </button>
    <button (click)="onConfirm()" class="btn btn-primary">
      {{ confirmText }}
    </button>
  </div>
</div>
