<div class="app-wrapper">
  <app-loading-block></app-loading-block>
  
  <header class="app-header">
    <div class="header-content">
      <div class="logo">
        <span class="play-icon">▶</span> VIDEO COURSE
      </div>
      <div class="header-links" *ngIf="isAuthenticated">
        <a href="#" class="header-link">{{ currentUserName }}</a>
        <span class="separator">|</span>
        <a href="#" class="header-link" (click)="logout(); $event.preventDefault()">Log off</a>
      </div>
    </div>
  </header>

  <app-breadcrumbs *ngIf="isAuthenticated"></app-breadcrumbs>
  
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <footer class="app-footer">
    <p>Copyright © Videocourses. All rights reserved!</p>
  </footer>
</div>
